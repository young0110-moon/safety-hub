name: Deploy AI worker
on:
  push:
    branches: [main]
    paths: ['ai-worker/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 비밀값 확인
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 비밀값이 아직 없어 배포를 건너뜁니다."; exit 0; fi
          echo "ok=1" >> $GITHUB_ENV
      - name: Wrangler 배포 (GEMINI_KEY·FIREBASE_SA 비밀값은 Cloudflare에 그대로 유지)
        if: env.ok == '1'
        working-directory: ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: 실행 위치 확인
        if: env.ok == '1'
        run: sleep 10; curl -s https://koelsa-ai.glare0110.workers.dev/ || true
