name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tailwind CSS 빌드 (CDN 없이 앱 안에 포함)
        run: |
          npm install --no-save tailwindcss@3.4.17
          npx tailwindcss -c tailwind.config.js -i tailwind.src.css -o tailwind.css --minify
          ls -la tailwind.css
      - name: Firebase 라이브러리 내려받기 (CDN 없이 앱 안에 포함)
        run: |
          mkdir -p vendor
          for f in firebase-app-compat firebase-auth-compat firebase-firestore-compat firebase-messaging-compat; do
            curl -fsSL "https://www.gstatic.com/firebasejs/10.14.1/$f.js" -o "vendor/$f.js"
          done
          ls -la vendor
      - name: 버전 표시 (폰 앱이 새 버전을 알아채도록)
        run: |
          V="${GITHUB_SHA::12}"
          sed -i "s/const BUILD='__BUILD__';/const BUILD='$V';/" index.html
          grep -q "const BUILD='$V';" index.html
          DV=$(cat data/*.json | sha1sum | cut -c1-10)
          sed -i "s/('__DATAV__')/('$DV')/" index.html
          grep -q "('$DV')" index.html
          sed -i "s/const VER='hub-[^']*';/const VER='hub-$V';/" sw.js
          echo "{\"v\":\"$V\"}" > version.json
          cat version.json
      - name: 배포 폴더 만들기
        run: |
          mkdir -p site
          cp -r index.html version.json config.js manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png eli.png manual.pdf tailwind.css vendor data README.md site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
