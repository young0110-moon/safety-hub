const EC_ORG={addr1:'부산광역시 해운대구',addr2:'센텀중앙로 90',addr3:'큐비이센텀 19층 1909호',tel:'051-784-8502',fax:'051-784-8506',web:'www.koelsa.or.kr',branch:'부산동부지사'};
function ecData(m){m=m||{};return {n:String(m.name||'').trim(),r:m.rank||'',d:String(m.team||'').trim(),m:String(m.tel||'').trim(),t:String(m.otel||'').trim(),f:String(m.fax||'').trim(),e:String(m.cmail||'').trim()}}

  const K=k=>`<b style="display:inline-block;width:14px;margin-right:8px;color:#111;font-weight:800">${k}</b>`,R=(k,v)=>v?`<div style="display:flex">${K(k)}<span style="flex:1;min-width:0;word-break:break-all">${v}</span></div>`:'';
  return `<div style="background:#fff;color:#1E1B4B;border-radius:18px;box-shadow:0 10px 26px rgba(60,30,120,.14);overflow:hidden;text-align:left;font-family:inherit">
  <div style="display:flex">
   <div style="width:31%;max-width:118px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAFAFC;border-right:1px solid #EEE;padding:18px 6px">
    <img src="${logo}" alt="" style="width:54px;height:54px">
    <div style="font-weight:900;font-size:12.5px;margin-top:8px;color:#2B2B2B;letter-spacing:-.5px;white-space:nowrap">한국승강기안전공단</div>
    <div style="font-size:5.6px;font-weight:700;color:#777;margin-top:2px;white-space:nowrap">KOREA ELEVATOR SAFETY AGENCY</div></div>

    <div style="font-size:11.5px;color:#666;font-weight:600;margin-top:3px">${E(EC_ORG.branch)}${c.d?' '+E(c.d):''}${c.r?' · '+E(c.r):''}</div>

    <div style="font-size:11px;line-height:1.55;color:#3F3F46">

  <div style="height:5px;background:linear-gradient(90deg,#F39A1E,#E85D2A 35%,#1E88E5 65%,#0D47A1)"></div></div>`}
function ecVcf(c){const L=['BEGIN:VCARD','VERSION:3.0',`N:${c.n};;;;`,`FN:${c.n}`,`ORG:한국승강기안전공단;${c.d||EC_ORG.branch}`];
  if(c.r)L.push(`TITLE:${c.r}`);if(c.m)L.push(`TEL;TYPE=CELL:${c.m}`);L.push(`TEL;TYPE=WORK:${c.t||EC_ORG.tel}`);L.push(`TEL;TYPE=FAX:${c.f||EC_ORG.fax}`);
  if(c.e)L.push(`EMAIL:${c.e}`);L.push(`ADR;TYPE=WORK:;;${EC_ORG.addr2} ${EC_ORG.addr3};${EC_ORG.addr1.split(' ')[1]||''};${EC_ORG.addr1.split(' ')[0]};;`,'URL:https://'+EC_ORG.web,'END:VCARD');return L.join('\r\n')}
function ecSaveVcf(c){const b=new Blob([ecVcf(c)],{type:'text/vcard;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=(c.n||'명함')+'.vcf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const ecEnc=c=>{const j=JSON.stringify(Object.fromEntries(Object.entries(c).filter(([,v])=>v)));return btoa(unescape(encodeURIComponent(j))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ecDec=h=>{try{h=h.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(h))))}catch(e){return null}};
/* 전화번호를 000-0000-0000 모양으로 (숫자만 넣어도 자동) */
function ecFmt(v){v=String(v||'').trim();const d=v.replace(/\D/g,'');if(!d)return v;
  if(/^02/.test(d))return d.length===9?d.replace(/^(02)(\d{3})(\d{4})$/,'$1-$2-$3'):d.length===10?d.replace(/^(02)(\d{4})(\d{4})$/,'$1-$2-$3'):v;
  if(d.length===11)return d.replace(/^(\d{3})(\d{4})(\d{4})$/,'$1-$2-$3');if(d.length===10)return d.replace(/^(\d{3})(\d{3})(\d{4})$/,'$1-$2-$3');
  if(d.length===8&&/^1[5-9]/.test(d))return d.replace(/^(\d{4})(\d{4})$/,'$1-$2');return v}
